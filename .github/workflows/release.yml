name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build release
    uses: ./.github/workflows/build.yml

  release:
    name: Publish tagged release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-module
          path: dist
      - name: Verify release inputs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 tools/ci_release.py --tag "$RELEASE_TAG" --package dist/LLC-Zygisk-Localizer-*.zip --revision "$GITHUB_SHA"
      - name: Publish exact changelog section and ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Never overwrite an existing release or replace its tested assets.
          gh release create "$RELEASE_TAG" dist/LLC-Zygisk-Localizer-*.zip \
            --verify-tag --title "$RELEASE_TAG" --notes-file dist/release-notes.md --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
